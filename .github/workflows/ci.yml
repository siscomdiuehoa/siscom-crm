name: CI

# Kiem tra thiet yeu cho moi Pull Request. Job "backend-pg" dung PostgreSQL TAM (service container song trong job, huy sau job):
# migrate deploy + migrate status/diff + integration tren DB siscom_crm_test_<stamp>. KHONG bao gio ket noi siscom_crm_dev hay may chu
# ngoai 127.0.0.1 cua runner; KHONG seed/reset/restore du lieu that; KHONG chay benchmark.
# Moi PR chay dung mot lan (su kien pull_request); sau khi merge, chay lai tren main (push). Huy lan chay cu khi co commit moi.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test

jobs:
  backend:
    name: Backend (build, tsc, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Chi de `prisma generate` doc duoc prisma.config.ts. KHONG ket noi: cong 1, khong mat khau, khong phai database that.
      DATABASE_URL: postgresql://ci_placeholder@127.0.0.1:1/ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Bao dam npm 11.x (backend khai bao engines npm >=11.6, engine-strict)
        run: npm install -g npm@11
      - name: Phien ban
        run: |
          node -v
          npm -v
      - name: Cai dependency (npm ci)
        run: npm ci
      - name: Build (prisma generate + nest build + kiem tra dist/main.js)
        run: npm run build
      - name: Kiem tra kieu TypeScript (gom ca test)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit test
        run: npm run test:unit

  backend-pg:
    name: Backend PostgreSQL (DB tam cach ly, migrate deploy, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Cung dong 18 voi moi truong du an (PostgreSQL 18.x). Container tam cua job; mat khau superuser duoi day CHI cho container nay,
        # khong phai bi mat cua du an va khong dung o bat ky noi nao khac.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci_container_only_not_a_project_secret
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_container_only_not_a_project_secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Bao dam npm 11.x (backend khai bao engines npm >=11.6, engine-strict)
        run: npm install -g npm@11
      - name: Cai dependency (npm ci)
        run: npm ci
      - name: Tao DB tam siscom_crm_test_<stamp> + role siscom_app va siscom_migrator (khong superuser); URL duoc mask
        run: bash scripts/ci/pg-temp-db.sh create
      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Migrate deploy tren DB tam (chi ap migration da co trong repo)
        run: |
          set -euo pipefail
          test -n "${TEST_DB_NAME:-}"
          echo "DB tam: ${TEST_DB_NAME}"
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Migrate status (khong con migration cho) + drift (schema.prisma khop DB; --exit-code => 2 neu lech)
        run: |
          set -euo pipefail
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: B1.4 P3 S1 - BAI TAI HIEN (RED) - verify TRUOC khi tach role (siscom_app con la chu so huu) => mong doi FAIL
        run: bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt fail app
      - name: B1.4 P3/P3c S1 + B3 A3 - TACH ROLE (ROLE_SPLIT + AUTH_ROLE bang superuser container, APP_GRANTS_V5 bang siscom_migrator, chay 2 lan) roi verify app + auth (GREEN)
        run: |
          set -euo pipefail
          bash scripts/ci/pg-temp-db.sh split
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
          # B3 A3 (ra soat doc lap): quyen mac dinh cap SELECT bang moi cho app => chot FAIL-CLOSED: app chi doc bang trong danh sach cho phep
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_APP_SELECT_ALLOWLIST.sql.txt res app
          # RED mong doi: bang nhay cam mo phong (migrator tao) => ALLOWLIST FAIL dung ten bang; REVOKE tuong minh => PASS; ROLLBACK, khong de lai
          out="$(bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_APP_SELECT_ALLOWLIST_RED_TEST.sql.txt fail migrator 2>&1)" || { echo "$out" | tail -20; echo 'KHONG DAT: ALLOWLIST_RED_TEST'; exit 1; }
          echo "$out" | grep -E 'ngoai danh sach: zz_b3_probe_bang_nhay_cam' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: ALLOWLIST khong bat bang nhay cam moi'; exit 1; }
          echo "$out" | grep -E '^PASS\|2$' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: sau REVOKE tuong minh ALLOWLIST khong PASS'; exit 1; }
          echo "$out" | grep -E 'bang thu con ton tai sau ROLLBACK = false' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: bang thu con lai'; exit 1; }
          echo 'DAT (RED mong doi): bang nhay cam moi bi ALLOWLIST bat; REVOKE tuong minh => PASS; khong de lai bang thu'
      - name: Sau S1 - migrate status + diff bang siscom_migrator (MIGRATE_DATABASE_URL, prisma.config.ts uu tien) va bang siscom_app (chi doc)
        run: |
          set -euo pipefail
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          MIGRATE_DATABASE_URL= npx prisma migrate status
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.TEST_MIGRATE_DATABASE_URL }}
      # B1.4 P3b: M1/M1.1 dung du lieu thu INSERT/UPDATE/DELETE tren employee_credential/employee_role/privileged_change_request/app_meta...
      # - siscom_app KHONG con quyen (APP_GRANTS_V2) => chay bang chu so huu siscom_migrator (rang buoc/trigger khong phu thuoc role).
      - name: Kiem thu rang buoc auth M1/M1.1/M1.2 (chu so huu siscom_migrator - P3b) + cau truc M1.3 (chi doc, siscom_app; moi file tu ROLLBACK)
        run: |
          set -euo pipefail
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_CONSTRAINT_TESTS.sql.txt res migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_1_CONSTRAINT_TESTS.sql.txt res migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_2_CONSTRAINT_TESTS.sql.txt res migrator
          # B3 A4: script cap 9 ma quyen activity.* qua yeu cau 2 nguoi (ADD idempotent, SoD admin, REMOVE) - cung tien de M1.2 (RBAC rong, bootstrap mo)
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_PERMISSIONS_TEST.sql.txt res migrator
          # Sales S5: phan loai BIZ cua opportunity.* (migration 20261118000000) + script cap 10 ma quyen qua yeu cau 2 nguoi (ADD idempotent, SoD admin, REMOVE) - cung tien de (RBAC rong, bootstrap mo)
          bash scripts/ci/pg-sql-check.sh docs/SALES_S5_OPPORTUNITY_PERMISSIONS_TEST.sql.txt res migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_3_STRUCTURE_TESTS.sql.txt ok app
          # B1.4 Remember Me: rang buoc 90 ngay, bat bien, thu hoi theo token_version (chu so huu, tu ROLLBACK)
          bash scripts/ci/pg-sql-check.sh docs/B1.4_REMEMBER_ME_STRUCTURE_TESTS.sql.txt res migrator
          # B3 A2: 7 CHECK, trigger, chi muc rieng phan, 2 bang moi (chu so huu; S34: siscom_app van CHI SELECT cho toi A3)
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_STRUCTURE_TESTS.sql.txt res migrator
          # Sales S2: CHECK, trigger cung khach/danh muc/ma co dinh, lich su chi them, activity.opportunity_id (chu so huu; S38: app chi SELECT cho toi S3/V5)
          bash scripts/ci/pg-sql-check.sh docs/SALES_S2_STRUCTURE_TESTS.sql.txt res migrator
      - name: Dien tap rollback day du (S1 -> M1.3 -> M1.2 -> M1.1 -> M1), migrate deploy lai (siscom_app), tach role lai, verify
        run: |
          set -euo pipefail
          bash scripts/ci/pg-temp-db.sh unsplit
          # Sales S9b (20261120000000_sales_opportunity_document) moi nhat => rollback DAU chuoi, truoc Sales S8b. PHAI TU CHOI khi con tai lieu (RED mong doi) + 9 kiem cau truc; transaction ngoai huy => khong de lai du lieu thu
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST.sql.txt run app 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST)'; exit 1; }
          echo "$out" | grep -E 'TU CHOI: con 2 dong opportunity_document' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST)'; exit 1; }
          if echo "$out" | grep -q 'CAU TRUC KHONG DAT'; then echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: cau truc tai lieu co hoi (SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST)'; exit 1; fi
          [ "$(echo "$out" | grep -c 'CAU TRUC ok')" = 9 ] || { echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: thieu dong kiem cau truc tai lieu co hoi'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST.sql.txt - 9 kiem cau truc ok, rollback tu choi khi con tai lieu co hoi'
          bash scripts/ci/pg-sql-check.sh docs/SALES_S9_DOCUMENT_ROLLBACK.sql.txt run app
          # Sales S8b (20261119000000_sales_activity_auto_kind) moi nhat => rollback DAU chuoi, truoc Sales S5
          # Sales S8b: rollback cot viec tu sinh PHAI TU CHOI khi con viec tu sinh (ke ca da xoa mem) - RED mong doi; kem kiem cau truc CHECK + chi muc unique; transaction ngoai huy => khong de lai du lieu thu
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST.sql.txt run app 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con 3 dong activity la viec tu sinh' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST)'; exit 1; }
          if echo "$out" | grep -q 'CAU TRUC KHONG DAT'; then echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: cau truc viec tu sinh (SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST)'; exit 1; fi
          [ "$(echo "$out" | grep -c 'CAU TRUC ok')" = 5 ] || { echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: thieu dong kiem cau truc viec tu sinh'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST.sql.txt - 5 kiem cau truc ok, rollback tu choi khi con viec tu sinh'
          bash scripts/ci/pg-sql-check.sh docs/SALES_S8_AUTO_KIND_ROLLBACK.sql.txt run app
          # Sales S5 (20261118000000_sales_perm_class) moi nhat => rollback DAU chuoi (tra fn_auth_perm_class ve ban M1), truoc Sales S2
          # Sales S5: rollback phan loai quyen PHAI TU CHOI khi permission con ma opportunity.* (RED mong doi; transaction ngoai huy => khong de lai ma thu, ham khong doi)
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST.sql.txt run app 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ ma opportunity' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST)'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST.sql.txt - rollback tu choi khi con ma opportunity.*'
          bash scripts/ci/pg-sql-check.sh docs/SALES_S5_PERM_CLASS_ROLLBACK.sql.txt run app
          # B1.4 cau 3: rollback migration moi nhat TRUOC (nguoc thu tu ap). Sales S2 (20261117000000) moi nhat => dau chuoi, roi B3 A2 (2 migration, 1 file)
          # Sales S2: rollback PHAI TU CHOI khi con co hoi (ke ca xoa mem) - RED mong doi; transaction ngoai huy => khong de lai du lieu thu
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S2_ROLLBACK_REFUSE_TEST.sql.txt run app 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S2_ROLLBACK_REFUSE_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ dong opportunity' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S2_ROLLBACK_REFUSE_TEST)'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S2_ROLLBACK_REFUSE_TEST.sql.txt - rollback tu choi khi con co hoi'
          bash scripts/ci/pg-sql-check.sh docs/SALES_S2_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_TASKS_ROLLBACK.sql.txt run app
          # PR #203 (04/11/2026): rollback 2 migration moi nhat TRUOC (contact roi customer); moi rollback phai TU CHOI khi co du lieu khong so
          out="$(bash scripts/ci/pg-sql-check.sh docs/CONTACT_ROLLBACK_REFUSE_TEST.sql.txt run app 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (CONTACT_ROLLBACK_REFUSE_TEST.sql.txt)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ nguoi lien he khong co so dien thoai lan email' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (CONTACT_ROLLBACK_REFUSE_TEST.sql.txt)'; exit 1; }
          echo 'DAT (RED mong doi): CONTACT_ROLLBACK_REFUSE_TEST.sql.txt - rollback tu choi, khong dien gia tri gia'
          bash scripts/ci/pg-sql-check.sh docs/CONTACT_REACH_OPTIONAL_ROLLBACK.sql.txt run app
          out="$(bash scripts/ci/pg-sql-check.sh docs/CUSTOMER_ROLLBACK_REFUSE_TEST.sql.txt run app 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (CUSTOMER_ROLLBACK_REFUSE_TEST.sql.txt)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ khach hang khong co so dien thoai' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (CUSTOMER_ROLLBACK_REFUSE_TEST.sql.txt)'; exit 1; }
          echo 'DAT (RED mong doi): CUSTOMER_ROLLBACK_REFUSE_TEST.sql.txt - rollback tu choi, khong dien gia tri gia'
          bash scripts/ci/pg-sql-check.sh docs/CUSTOMER_PHONE_OPTIONAL_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.4_SESSION_REMEMBER_FAMILY_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.4_REMEMBER_ME_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_3_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_2_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_1_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_ROLLBACK.sql.txt run app
          npx prisma migrate status || true
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          bash scripts/ci/pg-sql-check.sh docs/CUSTOMER_PHONE_OPTIONAL_STRUCTURE_TESTS.sql.txt res app
          bash scripts/ci/pg-temp-db.sh split
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Sau S1 - prisma migrate deploy bang siscom_migrator (MIGRATE_DATABASE_URL; khong con migration cho => thoat 0) + status
        run: |
          set -euo pipefail
          npx prisma migrate deploy
          npx prisma migrate status
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.TEST_MIGRATE_DATABASE_URL }}
      # B1.4 Remember Me (Issue #177): dien tap DUNG thu tu production - migration moi ap SAU khi tach role (bang siscom_migrator). Quyen mac dinh
      # (V3 muc 6) cap SELECT cho siscom_app tren bang MOI => VERIFY (app) phai bat duoc (B1f) cho toi khi chay lai V3. Rollback truoc, ap lai sau.
      - name: B1.4 Remember Me - rollback (migrator) => V3 => VERIFY PASS; migrate deploy (migrator) => VERIFY FAIL B1f (quyen mac dinh) => V3 => PASS app + auth + cau truc
        run: |
          set -euo pipefail
          # Sales S9b: moi nhat => rollback TRUOC Sales S8b (bang chu so huu sau tach role). PHAI TU CHOI khi con tai lieu (RED mong doi) + 9 kiem cau truc
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST)'; exit 1; }
          echo "$out" | grep -E 'TU CHOI: con 2 dong opportunity_document' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST)'; exit 1; }
          if echo "$out" | grep -q 'CAU TRUC KHONG DAT'; then echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: cau truc tai lieu co hoi (SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST)'; exit 1; fi
          [ "$(echo "$out" | grep -c 'CAU TRUC ok')" = 9 ] || { echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: thieu dong kiem cau truc tai lieu co hoi'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST.sql.txt - 9 kiem cau truc ok, rollback tu choi khi con tai lieu co hoi'
          bash scripts/ci/pg-sql-check.sh docs/SALES_S9_DOCUMENT_ROLLBACK.sql.txt run migrator
          # Sales S8b: moi nhat => rollback TRUOC Sales S5 (bang chu so huu sau tach role)
          # Sales S8b: rollback cot viec tu sinh PHAI TU CHOI khi con viec tu sinh (ke ca da xoa mem) - RED mong doi; kem kiem cau truc CHECK + chi muc unique; transaction ngoai huy => khong de lai du lieu thu
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con 3 dong activity la viec tu sinh' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST)'; exit 1; }
          if echo "$out" | grep -q 'CAU TRUC KHONG DAT'; then echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: cau truc viec tu sinh (SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST)'; exit 1; fi
          [ "$(echo "$out" | grep -c 'CAU TRUC ok')" = 5 ] || { echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: thieu dong kiem cau truc viec tu sinh'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST.sql.txt - 5 kiem cau truc ok, rollback tu choi khi con viec tu sinh'
          bash scripts/ci/pg-sql-check.sh docs/SALES_S8_AUTO_KIND_ROLLBACK.sql.txt run migrator
          # Sales S5: moi nhat => rollback TRUOC Sales S2. Bai tu choi con chung minh chuoi truoc da ap lai migration (tien dieu kien: opportunity.* dang la BIZ)
          # Sales S5: rollback phan loai quyen PHAI TU CHOI khi permission con ma opportunity.* (RED mong doi; transaction ngoai huy => khong de lai ma thu, ham khong doi)
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ ma opportunity' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST)'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST.sql.txt - rollback tu choi khi con ma opportunity.*'
          bash scripts/ci/pg-sql-check.sh docs/SALES_S5_PERM_CLASS_ROLLBACK.sql.txt run migrator
          # Sales S2: moi nhat => rollback TRUOC B3 (bang chu so huu sau tach role)
          bash scripts/ci/pg-sql-check.sh docs/SALES_S2_ROLLBACK.sql.txt run migrator
          # B3 A2: rollback S2 (ca 2 migration) -> gia lap S1 (chi migration 1 + dong _prisma_migrations checksum gia) -> rollback S1 (thiet ke §3.3a, B2)
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_TASKS_ROLLBACK.sql.txt run migrator
          bash scripts/ci/pg-sql-check.sh docs/B3_S1_STATE_TEST.sql.txt run migrator
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_TASKS_ROLLBACK.sql.txt run migrator
          # PR #203 (04/11/2026): rollback 2 migration moi nhat TRUOC (contact roi customer); moi rollback phai TU CHOI khi co du lieu khong so
          out="$(bash scripts/ci/pg-sql-check.sh docs/CONTACT_ROLLBACK_REFUSE_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (CONTACT_ROLLBACK_REFUSE_TEST.sql.txt)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ nguoi lien he khong co so dien thoai lan email' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (CONTACT_ROLLBACK_REFUSE_TEST.sql.txt)'; exit 1; }
          echo 'DAT (RED mong doi): CONTACT_ROLLBACK_REFUSE_TEST.sql.txt - rollback tu choi, khong dien gia tri gia'
          bash scripts/ci/pg-sql-check.sh docs/CONTACT_REACH_OPTIONAL_ROLLBACK.sql.txt run migrator
          out="$(bash scripts/ci/pg-sql-check.sh docs/CUSTOMER_ROLLBACK_REFUSE_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (CUSTOMER_ROLLBACK_REFUSE_TEST.sql.txt)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ khach hang khong co so dien thoai' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (CUSTOMER_ROLLBACK_REFUSE_TEST.sql.txt)'; exit 1; }
          echo 'DAT (RED mong doi): CUSTOMER_ROLLBACK_REFUSE_TEST.sql.txt - rollback tu choi, khong dien gia tri gia'
          bash scripts/ci/pg-sql-check.sh docs/CUSTOMER_PHONE_OPTIONAL_ROLLBACK.sql.txt run migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.4_SESSION_REMEMBER_FAMILY_ROLLBACK.sql.txt run migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.4_REMEMBER_ME_ROLLBACK.sql.txt run migrator
          # B3 A2: seed 5 loai hoat dong CU truoc khi migrate deploy ap lai => chung minh tuong thich nguoc voi DB co du lieu (kiem sau deploy)
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_SEED_OLDTYPES_TEST.sql.txt run migrator
          # B3 A3 / Sales S3: V5 chay duoc khi bang B3 va bang Sales CHUA ton tai (sau rollback) va VERIFY van PASS (B1/B1s/E5s bao to_regclass)
          bash scripts/ci/pg-temp-db.sh grants v5
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          npx prisma migrate deploy
          npx prisma migrate status
          out="$(bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app 2>&1)" && { echo "$out" | tail -5; echo 'KHONG DAT: VERIFY phai FAIL (B1f) truoc khi chay lai V5'; exit 1; } || true
          echo "$out" | grep -E '^B1f .*KHONG DAT' || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay B1f bi bat'; exit 1; }
          echo 'DAT (RED mong doi): bang moi nhan SELECT mac dinh cho siscom_app => VERIFY bat B1f'
          bash scripts/ci/pg-temp-db.sh grants v5
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_APP_SELECT_ALLOWLIST.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.4_REMEMBER_ME_STRUCTURE_TESTS.sql.txt res migrator
          # B3 A2: dong cu sau migrate (DONE/version 1/cot moi NULL, khong UPDATE hang loat) + cau truc sau ap lai
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_SEED_OLDTYPES_CHECK.sql.txt res migrator
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_STRUCTURE_TESTS.sql.txt res migrator
          # Sales S2: cau truc sau ap lai bang migrator (thu tu production) + quyen mac dinh: app chi SELECT 2 bang moi (S38), ALLOWLIST da co 2 bang
          bash scripts/ci/pg-sql-check.sh docs/SALES_S2_STRUCTURE_TESTS.sql.txt res migrator
          # Sales S2: rollback PHAI TU CHOI khi con co hoi (ke ca xoa mem) - RED mong doi; transaction ngoai huy => khong de lai du lieu thu
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S2_ROLLBACK_REFUSE_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S2_ROLLBACK_REFUSE_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ dong opportunity' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S2_ROLLBACK_REFUSE_TEST)'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S2_ROLLBACK_REFUSE_TEST.sql.txt - rollback tu choi khi con co hoi'
          # B3 A2: rollback PHAI TU CHOI khi con TASK (ke ca xoa mem) / cot moi co gia tri - khong tu xoa du lieu (RED mong doi; transaction ngoai huy => khong de lai du lieu thu)
          out="$(bash scripts/ci/pg-sql-check.sh docs/B3_ROLLBACK_REFUSE_TASK_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (B3_ROLLBACK_REFUSE_TASK_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ dong activity type=TASK' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (B3_ROLLBACK_REFUSE_TASK_TEST)'; exit 1; }
          echo 'DAT (RED mong doi): B3_ROLLBACK_REFUSE_TASK_TEST.sql.txt - rollback tu choi khi con TASK'
          out="$(bash scripts/ci/pg-sql-check.sh docs/B3_ROLLBACK_REFUSE_COLS_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (B3_ROLLBACK_REFUSE_COLS_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ dong activity co gia tri o cot moi' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (B3_ROLLBACK_REFUSE_COLS_TEST)'; exit 1; }
          echo 'DAT (RED mong doi): B3_ROLLBACK_REFUSE_COLS_TEST.sql.txt - rollback tu choi khi cot moi co gia tri'
          # B3 A2: sau 2 ca tu choi, trang thai DB con nguyen (seed 5 loai cu + cau truc B3 van PASS - thiet ke §3.3f(3))
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_SEED_OLDTYPES_CHECK.sql.txt res migrator
          bash scripts/ci/pg-sql-check.sh docs/CUSTOMER_PHONE_OPTIONAL_STRUCTURE_TESTS.sql.txt res migrator
          # Sales S2: sau ca tu choi, cau truc va du lieu con nguyen
          bash scripts/ci/pg-sql-check.sh docs/SALES_S2_STRUCTURE_TESTS.sql.txt res migrator
          # Sales S9b: sau khi ap lai (migrator), bang tai lieu + CHECK + trigger co lai va rollback van tu choi khi con tai lieu
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST)'; exit 1; }
          echo "$out" | grep -E 'TU CHOI: con 2 dong opportunity_document' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST)'; exit 1; }
          if echo "$out" | grep -q 'CAU TRUC KHONG DAT'; then echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: cau truc tai lieu co hoi (SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST)'; exit 1; fi
          [ "$(echo "$out" | grep -c 'CAU TRUC ok')" = 9 ] || { echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: thieu dong kiem cau truc tai lieu co hoi'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S9_DOCUMENT_ROLLBACK_REFUSE_TEST.sql.txt - 9 kiem cau truc ok, rollback tu choi khi con tai lieu co hoi'
          # Sales S8b: sau khi ap lai (migrator), cot + CHECK + chi muc viec tu sinh co lai va rollback van tu choi khi con viec tu sinh
          # Sales S8b: rollback cot viec tu sinh PHAI TU CHOI khi con viec tu sinh (ke ca da xoa mem) - RED mong doi; kem kiem cau truc CHECK + chi muc unique; transaction ngoai huy => khong de lai du lieu thu
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con 3 dong activity la viec tu sinh' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST)'; exit 1; }
          if echo "$out" | grep -q 'CAU TRUC KHONG DAT'; then echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: cau truc viec tu sinh (SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST)'; exit 1; fi
          [ "$(echo "$out" | grep -c 'CAU TRUC ok')" = 5 ] || { echo "$out" | grep 'CAU TRUC'; echo 'KHONG DAT: thieu dong kiem cau truc viec tu sinh'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S8_AUTO_KIND_ROLLBACK_REFUSE_TEST.sql.txt - 5 kiem cau truc ok, rollback tu choi khi con viec tu sinh'
          # Sales S5: sau khi ap lai (migrator), opportunity.* lai thuoc nhom BIZ (tien dieu kien cua bai) va rollback van tu choi khi con ma
          # Sales S5: rollback phan loai quyen PHAI TU CHOI khi permission con ma opportunity.* (RED mong doi; transaction ngoai huy => khong de lai ma thu, ham khong doi)
          out="$(bash scripts/ci/pg-sql-check.sh docs/SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ ma opportunity' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST)'; exit 1; }
          echo 'DAT (RED mong doi): SALES_S5_PERM_CLASS_ROLLBACK_REFUSE_TEST.sql.txt - rollback tu choi khi con ma opportunity.*'
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.TEST_MIGRATE_DATABASE_URL }}
      # Sales S2 (PR237-R1-01/02): HAI KET NOI that tren DB tam RIENG (tao + DROP trong buoc): lien he cung khach o ca hai thu tu (FK ghep),
      # rollback khoa ghi truoc khi kiem (ghi den truoc => tu choi, rollback den truoc => ghi bi chan, khong mat dong da commit), rollback khi ap mot phan.
      - name: Sales S2 - kiem dong thoi hai ket noi (lien he cung khach, rollback khoa truoc khi kiem) + rollback khi migration ap mot phan
        run: bash scripts/ci/sales-s2-concurrency.sh
      # Sales S5 (PR240-R1-01/02): HAI KET NOI that tren DB tam RIENG (tao + DROP trong buoc): migration phan loai quyen doi dau cap quyen cho admin,
      # rollback doi dau chen ma / script ADD, script REMOVE doi dau cap quyen ngoai ma tran / doi scope - ca hai thu tu; ben den sau cho roi bi tu choi.
      - name: Sales S5 - kiem dong thoi hai ket noi (migration / rollback phan loai quyen, script cap va go quyen khoa truoc khi tien kiem)
        run: bash scripts/ci/sales-s5-concurrency.sh
      - name: Integration test tren DB tam DA TACH ROLE (ung dung = siscom_app; bootstrap/ALTER DATABASE qua TEST_MIGRATE_DATABASE_URL)
        run: |
          set -euo pipefail
          unset DATABASE_URL
          test -n "${TEST_AUTH_DATABASE_URL:-}" || { echo "THIEU TEST_AUTH_DATABASE_URL (P3c): db-roles P3c se bi skip"; exit 1; }
          npm run test:e2e:customers
        env:
          CONCURRENCY_ROUNDS: "20"
      - name: B1.4 P3b/P3c + B3 A3 + Sales S3 - dien tap rollback quyen (V1 => FAIL; V2 => FAIL muc G; V4 = rollback S3 => FAIL B1s + E5s; V3 = rollback A3 => FAIL B1 + E5 + B1s + E5s; V5 lai => PASS app + auth)
        run: |
          set -euo pipefail
          bash scripts/ci/pg-temp-db.sh grants v1
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt fail app
          bash scripts/ci/pg-temp-db.sh grants v2
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt fail app
          # Sales S3: V4 la duong rollback cua V5 => VERIFY phai FAIL dung 2 muc B1s + E5s (app mat ghi opportunity / opportunity_change: catalog + probe), VERIFY_AUTH van PASS
          bash scripts/ci/pg-temp-db.sh grants v4
          out="$(bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app 2>&1)" && { echo "$out" | tail -5; echo 'KHONG DAT: VERIFY phai FAIL (B1s + E5s) sau khi rollback ve V4'; exit 1; } || true
          echo "$out" | grep -E '^B1s .*KHONG DAT' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay B1s bi bat sau V4'; exit 1; }
          echo "$out" | grep -E '^E5s .*KHONG DAT' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay E5s bi bat sau V4'; exit 1; }
          echo "$out" | grep -E '^FAIL\|2$' >/dev/null || { echo "$out" | grep -E 'KHONG DAT|FAIL'; echo 'KHONG DAT: sau V4 chi duoc FAIL dung 2 muc (B1s + E5s)'; exit 1; }
          echo 'DAT (RED mong doi): rollback V5 -> V4 => VERIFY bat B1s + E5s (app mat ghi Sales), khong muc nao khac'
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
          # B3 A3: V3 la duong rollback cua V4 => them B1 + E5 (app mat ghi activity) => FAIL dung 4 muc B1 + E5 + B1s + E5s
          bash scripts/ci/pg-temp-db.sh grants v3
          out="$(bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app 2>&1)" && { echo "$out" | tail -5; echo 'KHONG DAT: VERIFY phai FAIL sau khi rollback ve V3'; exit 1; } || true
          for m in B1 E5 B1s E5s; do echo "$out" | grep -E "^$m .*KHONG DAT" >/dev/null || { echo "$out" | tail -20; echo "KHONG DAT: khong thay $m bi bat sau V3"; exit 1; }; done
          echo "$out" | grep -E '^FAIL\|4$' >/dev/null || { echo "$out" | grep -E 'KHONG DAT|FAIL'; echo 'KHONG DAT: sau V3 chi duoc FAIL dung 4 muc (B1 + E5 + B1s + E5s)'; exit 1; }
          echo 'DAT (RED mong doi): rollback ve V3 => VERIFY bat B1 + E5 + B1s + E5s, khong muc nao khac'
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
          bash scripts/ci/pg-temp-db.sh grants v5
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
      - name: B1.4 P3c - dien tap rollback role auth (V2 => AUTH_ROLE_ROLLBACK voi canary3 cung cluster) roi tach lai (AUTH_ROLE + V5) => PASS app + auth
        run: |
          set -euo pipefail
          bash scripts/ci/pg-temp-db.sh grants v2
          bash scripts/ci/pg-temp-db.sh unauth
          bash scripts/ci/pg-temp-db.sh auth
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
      - name: Don DB tam (container cung bi huy sau job)
        if: ${{ always() }}
        run: bash scripts/ci/pg-temp-db.sh drop

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/siscom-crm-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/siscom-crm-web/package-lock.json
      - name: Phien ban
        run: |
          node -v
          npm -v
      - name: Cai dependency (npm ci)
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test offline FE (R01 adapter + M02 XSS + S02 cau noi auth + PR4 phien cookie + PR7 nhan vien phu trach + D.0 ngay gio VN; node --test, khong Chrome, khong DB)
        run: |
          set -euo pipefail
          FILES="tests/customerAdapter.test.mjs tests/xssIsolation.test.mjs tests/customerAuthBridge.test.mjs tests/customerApiAuthHeader.test.mjs tests/cookieSession.test.mjs tests/customerApiClientSession.test.mjs tests/rootSelector.test.mjs tests/ownerCandidates.test.mjs tests/changePassword.test.mjs tests/dateVN.test.mjs tests/rememberMe.test.mjs tests/customerContactPerson.test.mjs tests/mobilePwa.test.mjs tests/customerPhoneOptional.test.mjs tests/apiModeListEditAction.test.mjs tests/activityModel.test.mjs tests/activityApiUi.test.mjs tests/tasksModel.test.mjs tests/tasksApiUi.test.mjs tests/opportunitiesModel.test.mjs tests/opportunitiesUi.test.mjs tests/opportunitiesApiUi.test.mjs tests/opportunitiesDetail.test.mjs tests/opportunitiesDetailApiUi.test.mjs tests/opportunitiesBoardApiUi.test.mjs tests/loginV3.test.mjs tests/checkboxCheckIcon.test.mjs tests/modalFocus.test.mjs"
          # node --test coi duong dan khong ton tai nhu glob rong va van thoat 0 -> bat buoc kiem tra ton tai.
          for f in $FILES; do test -f "$f" || { echo "THIEU file test: $f"; exit 1; }; done
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=node-tests-junit.xml $FILES
          node ../../backend/scripts/ci/check-node-test-count.mjs node-tests-junit.xml "${MIN_NODE_TESTS}"
        env:
          MIN_NODE_TESTS: "80"

  secret-scan:
    name: Quet bi mat (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cai gitleaks (ghim phien ban, kiem tra SHA-256)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Quet lich su Git (an gia tri bi mat trong log)
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  # B1.4 P4 (PR #232, F3): script trien khai Linux tren Ubuntu 24.04 (cung ban voi VPS). Chi dung PostgreSQL TAM do script tu initdb
  # (cong 55871, xoa sau khi chay); cluster mac dinh cua goi postgresql-18 bi dung ngay. Khong cham may chu/DB nao ngoai runner.
  linux-scripts:
    name: Linux scripts (shellcheck, guard, backup-pull, dien tap PG18, argon2, systemd, Caddy)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CADDY_IMAGE: "caddy:2.10.2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Bao dam npm 11.x
        run: npm install -g npm@11
      - name: Cai PostgreSQL 18 (PGDG, nhu provision.sh), age, shellcheck
        run: |
          set -euo pipefail
          if ! grep -rqs 'apt.postgresql.org' /etc/apt/sources.list /etc/apt/sources.list.d/; then
            sudo install -d -m 755 /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-ci.list >/dev/null
          fi
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18 age shellcheck openssh-server
          sudo systemctl stop postgresql || true
          /usr/lib/postgresql/18/bin/postgres --version; age --version; shellcheck --version | head -2; ssh -V
      - name: bash -n + ShellCheck (-S warning)
        run: |
          set -euo pipefail
          for f in backend/scripts/linux/*.sh backend/scripts/linux/tests/*.sh; do bash -n "$f"; done
          shellcheck -x -S warning -e SC1091 backend/scripts/linux/*.sh backend/scripts/linux/tests/*.sh
      - name: Test guard (khong can PostgreSQL)
        run: bash backend/scripts/linux/tests/test-guards.sh
      - name: pull-backups.ps1 - test offline (pwsh, bo sao luu gia ky bang khoa tam)
        run: pwsh -NoProfile -File backend/scripts/windows/pull-backups.test.ps1
      - name: backup-pull e2e that (setup-backup-pull.sh + sshd rieng 127.0.0.1:2222 + thu muc keo rieng + pwsh keo qua sftp chi doc)
        run: |
          set -euo pipefail
          pwsh --version
          sudo env PATH="$PATH" bash backend/scripts/linux/tests/e2e-backup-pull.sh
      - name: npm ci --ignore-scripts + build + argon2 hash/verify + Prisma CLI (dung quy trinh deploy.sh)
        working-directory: backend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          env -u MIGRATE_DATABASE_URL DATABASE_URL=postgresql://ci_placeholder@127.0.0.1:1/x npm run build
          bash -c '. scripts/linux/lib.sh; backend_runtime_smoke .'
      - name: Dien tap PostgreSQL 18 tam (create-db, migrate, grants+VERIFY, seed, bootstrap, backup ky+age, restore-test, F1 negative, backend production)
        run: PG_BIN=/usr/lib/postgresql/18/bin bash backend/scripts/linux/tests/rehearse-pg.sh
      - name: provision.sh --dry-run tren Ubuntu 24.04 that (root de doc cong that bang sshd -T; dry-run khong doi gi)
        run: |
          set -euo pipefail
          # Runner: ssh kich hoat theo socket nen /run/sshd co the chua co (tren VPS phien SSH dang mo => da co); chi tao thu muc runtime.
          sudo install -d -m 0755 /run/sshd
          echo "Cong sshd tren runner: $(sudo sshd -T | awk '$1 == "port" { print $2 }' | paste -sd, -)"
          # Che do IPv4 (runner khong co IP cong khai co dinh => khai SISCOM_PUBLIC_IP; 203.0.113.10 la dia chi tai lieu TEST-NET-3).
          sudo env SISCOM_HOST=203.0.113.10 SISCOM_PUBLIC_IP=203.0.113.10 PATH="$PATH" bash backend/scripts/linux/provision.sh --dry-run --ssh-key-only | tee /tmp/prov.out
          grep -q '^\[DRY\] ufw allow 22/tcp' /tmp/prov.out
          grep -q 'kiem ufw status' /tmp/prov.out
          grep -q 'tls-ip-shortlived.caddy' /tmp/prov.out
          # Che do ten mien voi DNS THAT: ban ghi A cua crm-staging.siscom.io.vn (chua co, hoac 42.96.15.235) khong bao gio bang 203.0.113.10
          # => script PHAI dung o buoc kiem DNS, truoc apt.
          if sudo env SISCOM_HOST=crm-staging.siscom.io.vn SISCOM_PUBLIC_IP=203.0.113.10 PATH="$PATH" bash backend/scripts/linux/provision.sh --dry-run > /tmp/prov-dns.out 2>&1; then
            echo "KHONG DAT: DNS khong tro ve may nay nhung provision van chay"; exit 1
          fi
          cat /tmp/prov-dns.out
          grep -q 'DNS chua dung' /tmp/prov-dns.out
          ! grep -q 'apt-get' /tmp/prov-dns.out
      - name: systemd-analyze verify (ban sao tam, chi doi duong dan ExecStart cho runner)
        run: |
          set -euo pipefail
          id siscom >/dev/null 2>&1 || sudo useradd --system --no-create-home --shell /usr/sbin/nologin siscom
          d="$(mktemp -d)"; cp backend/scripts/linux/systemd/* "$d/"
          sed -i "s#^ExecStart=/usr/bin/node #ExecStart=$(command -v node) #" "$d/siscom-crm-backend.service"
          sed -i "s#^ExecStart=.*backup-db.sh#ExecStart=/usr/bin/true#" "$d/siscom-crm-backup.service"
          systemd-analyze verify "$d/siscom-crm-backend.service" "$d/siscom-crm-backup.service" "$d/siscom-crm-backup.timer"
          systemd-analyze security --offline=true "$d/siscom-crm-backend.service" | tail -n 1 || true   # chi de tham khao
      - name: caddy validate 3 che do TLS (ten mien | IPv4 profile shortlived | IPv4 tls internal) - anh chinh thuc, ghim phien ban
        run: |
          set -euo pipefail
          c="$PWD/backend/scripts/linux/caddy"
          for combo in "crm-staging.siscom.io.vn tls-domain.caddy" "203.0.113.10 tls-ip-shortlived.caddy" "203.0.113.10 tls-ip-internal.caddy"; do
            set -- $combo
            echo "--- SISCOM_HOST=$1, $2 ---"
            docker run --rm -e SISCOM_HOST="$1" -v "$c/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$c/$2:/etc/caddy/siscom-tls.caddy:ro" \
              "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            # adapt ra JSON de thay dung issuer/profile da duoc hieu (khong chi la "khong loi cu phap")
            docker run --rm -e SISCOM_HOST="$1" -v "$c/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$c/$2:/etc/caddy/siscom-tls.caddy:ro" \
              "$CADDY_IMAGE" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /tmp/adapt.json
            case "$2" in
              tls-ip-shortlived.caddy) grep -q '"profile":"shortlived"' /tmp/adapt.json ;;
              tls-ip-internal.caddy) grep -q '"module":"internal"' /tmp/adapt.json ;;
              tls-domain.caddy) ! grep -q '"profile"' /tmp/adapt.json ;;
            esac
            echo "dat: $2"
          done

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [backend, backend-pg, frontend, secret-scan, linux-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tat ca kiem tra bat buoc phai dat
        run: |
          echo "backend=${{ needs.backend.result }} backend-pg=${{ needs.backend-pg.result }} frontend=${{ needs.frontend.result }} secret-scan=${{ needs.secret-scan.result }} linux-scripts=${{ needs.linux-scripts.result }}"
          test "${{ needs.linux-scripts.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.backend-pg.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.secret-scan.result }}" = "success"
