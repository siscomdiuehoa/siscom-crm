name: CI

# Kiem tra thiet yeu cho moi Pull Request. Job "backend-pg" dung PostgreSQL TAM (service container song trong job, huy sau job):
# migrate deploy + migrate status/diff + integration tren DB siscom_crm_test_<stamp>. KHONG bao gio ket noi siscom_crm_dev hay may chu
# ngoai 127.0.0.1 cua runner; KHONG seed/reset/restore du lieu that; KHONG chay benchmark.
# Moi PR chay dung mot lan (su kien pull_request); sau khi merge, chay lai tren main (push). Huy lan chay cu khi co commit moi.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test

jobs:
  backend:
    name: Backend (build, tsc, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Chi de `prisma generate` doc duoc prisma.config.ts. KHONG ket noi: cong 1, khong mat khau, khong phai database that.
      DATABASE_URL: postgresql://ci_placeholder@127.0.0.1:1/ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Bao dam npm 11.x (backend khai bao engines npm >=11.6, engine-strict)
        run: npm install -g npm@11
      - name: Phien ban
        run: |
          node -v
          npm -v
      - name: Cai dependency (npm ci)
        run: npm ci
      - name: Build (prisma generate + nest build + kiem tra dist/main.js)
        run: npm run build
      - name: Kiem tra kieu TypeScript (gom ca test)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit test
        run: npm run test:unit

  backend-pg:
    name: Backend PostgreSQL (DB tam cach ly, migrate deploy, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Cung dong 18 voi moi truong du an (PostgreSQL 18.x). Container tam cua job; mat khau superuser duoi day CHI cho container nay,
        # khong phai bi mat cua du an va khong dung o bat ky noi nao khac.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci_container_only_not_a_project_secret
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_container_only_not_a_project_secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Bao dam npm 11.x (backend khai bao engines npm >=11.6, engine-strict)
        run: npm install -g npm@11
      - name: Cai dependency (npm ci)
        run: npm ci
      - name: Tao DB tam siscom_crm_test_<stamp> + role siscom_app va siscom_migrator (khong superuser); URL duoc mask
        run: bash scripts/ci/pg-temp-db.sh create
      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Migrate deploy tren DB tam (chi ap migration da co trong repo)
        run: |
          set -euo pipefail
          test -n "${TEST_DB_NAME:-}"
          echo "DB tam: ${TEST_DB_NAME}"
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Migrate status (khong con migration cho) + drift (schema.prisma khop DB; --exit-code => 2 neu lech)
        run: |
          set -euo pipefail
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: B1.4 P3 S1 - BAI TAI HIEN (RED) - verify TRUOC khi tach role (siscom_app con la chu so huu) => mong doi FAIL
        run: bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt fail app
      - name: B1.4 P3/P3c S1 - TACH ROLE (ROLE_SPLIT + AUTH_ROLE bang superuser container, APP_GRANTS_V3 bang siscom_migrator, chay 2 lan) roi verify app + auth (GREEN)
        run: |
          set -euo pipefail
          bash scripts/ci/pg-temp-db.sh split
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
      - name: Sau S1 - migrate status + diff bang siscom_migrator (MIGRATE_DATABASE_URL, prisma.config.ts uu tien) va bang siscom_app (chi doc)
        run: |
          set -euo pipefail
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          MIGRATE_DATABASE_URL= npx prisma migrate status
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.TEST_MIGRATE_DATABASE_URL }}
      # B1.4 P3b: M1/M1.1 dung du lieu thu INSERT/UPDATE/DELETE tren employee_credential/employee_role/privileged_change_request/app_meta...
      # - siscom_app KHONG con quyen (APP_GRANTS_V2) => chay bang chu so huu siscom_migrator (rang buoc/trigger khong phu thuoc role).
      - name: Kiem thu rang buoc auth M1/M1.1/M1.2 (chu so huu siscom_migrator - P3b) + cau truc M1.3 (chi doc, siscom_app; moi file tu ROLLBACK)
        run: |
          set -euo pipefail
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_CONSTRAINT_TESTS.sql.txt res migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_1_CONSTRAINT_TESTS.sql.txt res migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_2_CONSTRAINT_TESTS.sql.txt res migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_3_STRUCTURE_TESTS.sql.txt ok app
          # B1.4 Remember Me: rang buoc 90 ngay, bat bien, thu hoi theo token_version (chu so huu, tu ROLLBACK)
          bash scripts/ci/pg-sql-check.sh docs/B1.4_REMEMBER_ME_STRUCTURE_TESTS.sql.txt res migrator
          # B3 A2: 7 CHECK, trigger, chi muc rieng phan, 2 bang moi (chu so huu; S34: siscom_app van CHI SELECT cho toi A3)
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_STRUCTURE_TESTS.sql.txt res migrator
      - name: Dien tap rollback day du (S1 -> M1.3 -> M1.2 -> M1.1 -> M1), migrate deploy lai (siscom_app), tach role lai, verify
        run: |
          set -euo pipefail
          bash scripts/ci/pg-temp-db.sh unsplit
          # B1.4 cau 3: rollback migration moi nhat TRUOC (nguoc thu tu ap). B3 A2 (2 migration, 1 file rollback) moi nhat => dau chuoi
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_TASKS_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.4_SESSION_REMEMBER_FAMILY_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.4_REMEMBER_ME_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_3_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_2_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_1_ROLLBACK.sql.txt run app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_M1_ROLLBACK.sql.txt run app
          npx prisma migrate status || true
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          bash scripts/ci/pg-temp-db.sh split
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Sau S1 - prisma migrate deploy bang siscom_migrator (MIGRATE_DATABASE_URL; khong con migration cho => thoat 0) + status
        run: |
          set -euo pipefail
          npx prisma migrate deploy
          npx prisma migrate status
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.TEST_MIGRATE_DATABASE_URL }}
      # B1.4 Remember Me (Issue #177): dien tap DUNG thu tu production - migration moi ap SAU khi tach role (bang siscom_migrator). Quyen mac dinh
      # (V3 muc 6) cap SELECT cho siscom_app tren bang MOI => VERIFY (app) phai bat duoc (B1f) cho toi khi chay lai V3. Rollback truoc, ap lai sau.
      - name: B1.4 Remember Me - rollback (migrator) => V3 => VERIFY PASS; migrate deploy (migrator) => VERIFY FAIL B1f (quyen mac dinh) => V3 => PASS app + auth + cau truc
        run: |
          set -euo pipefail
          # B3 A2: rollback S2 (ca 2 migration) -> gia lap S1 (chi migration 1 + dong _prisma_migrations checksum gia) -> rollback S1 (thiet ke §3.3a, B2)
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_TASKS_ROLLBACK.sql.txt run migrator
          bash scripts/ci/pg-sql-check.sh docs/B3_S1_STATE_TEST.sql.txt run migrator
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_TASKS_ROLLBACK.sql.txt run migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.4_SESSION_REMEMBER_FAMILY_ROLLBACK.sql.txt run migrator
          bash scripts/ci/pg-sql-check.sh docs/B1.4_REMEMBER_ME_ROLLBACK.sql.txt run migrator
          # B3 A2: seed 5 loai hoat dong CU truoc khi migrate deploy ap lai => chung minh tuong thich nguoc voi DB co du lieu (kiem sau deploy)
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_SEED_OLDTYPES_TEST.sql.txt run migrator
          bash scripts/ci/pg-temp-db.sh grants v3
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          npx prisma migrate deploy
          npx prisma migrate status
          out="$(bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app 2>&1)" && { echo "$out" | tail -5; echo 'KHONG DAT: VERIFY phai FAIL (B1f) truoc khi chay lai V3'; exit 1; } || true
          echo "$out" | grep -E '^B1f .*KHONG DAT' || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay B1f bi bat'; exit 1; }
          echo 'DAT (RED mong doi): bang moi nhan SELECT mac dinh cho siscom_app => VERIFY bat B1f'
          bash scripts/ci/pg-temp-db.sh grants v3
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
          bash scripts/ci/pg-sql-check.sh docs/B1.4_REMEMBER_ME_STRUCTURE_TESTS.sql.txt res migrator
          # B3 A2: dong cu sau migrate (DONE/version 1/cot moi NULL, khong UPDATE hang loat) + cau truc sau ap lai
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_SEED_OLDTYPES_CHECK.sql.txt res migrator
          bash scripts/ci/pg-sql-check.sh docs/B3_ACTIVITY_STRUCTURE_TESTS.sql.txt res migrator
          # B3 A2: rollback PHAI TU CHOI khi con TASK (ke ca xoa mem) / cot moi co gia tri - khong tu xoa du lieu (RED mong doi; transaction ngoai huy => khong de lai du lieu thu)
          out="$(bash scripts/ci/pg-sql-check.sh docs/B3_ROLLBACK_REFUSE_TASK_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (B3_ROLLBACK_REFUSE_TASK_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ dong activity type=TASK' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (B3_ROLLBACK_REFUSE_TASK_TEST)'; exit 1; }
          echo 'DAT (RED mong doi): B3_ROLLBACK_REFUSE_TASK_TEST.sql.txt - rollback tu choi khi con TASK'
          out="$(bash scripts/ci/pg-sql-check.sh docs/B3_ROLLBACK_REFUSE_COLS_TEST.sql.txt run migrator 2>&1)" && { echo "$out" | tail -8; echo 'KHONG DAT: rollback phai TU CHOI (B3_ROLLBACK_REFUSE_COLS_TEST)'; exit 1; } || true
          echo "$out" | grep -E 'TU CHOI: con [0-9]+ dong activity co gia tri o cot moi' >/dev/null || { echo "$out" | tail -20; echo 'KHONG DAT: khong thay thong bao TU CHOI (B3_ROLLBACK_REFUSE_COLS_TEST)'; exit 1; }
          echo 'DAT (RED mong doi): B3_ROLLBACK_REFUSE_COLS_TEST.sql.txt - rollback tu choi khi cot moi co gia tri'
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.TEST_MIGRATE_DATABASE_URL }}
      - name: Integration test tren DB tam DA TACH ROLE (ung dung = siscom_app; bootstrap/ALTER DATABASE qua TEST_MIGRATE_DATABASE_URL)
        run: |
          set -euo pipefail
          unset DATABASE_URL
          test -n "${TEST_AUTH_DATABASE_URL:-}" || { echo "THIEU TEST_AUTH_DATABASE_URL (P3c): db-roles P3c se bi skip"; exit 1; }
          npm run test:e2e:customers
        env:
          CONCURRENCY_ROUNDS: "20"
      - name: B1.4 P3b/P3c - dien tap rollback quyen (V1 => VERIFY FAIL; V2 = rollback P3c => VERIFY FAIL muc G vi app con quyen xac thuc; V3 lai => PASS app + auth)
        run: |
          set -euo pipefail
          bash scripts/ci/pg-temp-db.sh grants v1
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt fail app
          bash scripts/ci/pg-temp-db.sh grants v2
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt fail app
          bash scripts/ci/pg-temp-db.sh grants v3
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
      - name: B1.4 P3c - dien tap rollback role auth (V2 => AUTH_ROLE_ROLLBACK voi canary3 cung cluster) roi tach lai (AUTH_ROLE + V3) => PASS app + auth
        run: |
          set -euo pipefail
          bash scripts/ci/pg-temp-db.sh grants v2
          bash scripts/ci/pg-temp-db.sh unauth
          bash scripts/ci/pg-temp-db.sh auth
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY.sql.txt res app
          bash scripts/ci/pg-sql-check.sh docs/B1.3_S1_VERIFY_AUTH.sql.txt res su
      - name: Don DB tam (container cung bi huy sau job)
        if: ${{ always() }}
        run: bash scripts/ci/pg-temp-db.sh drop

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/siscom-crm-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/siscom-crm-web/package-lock.json
      - name: Phien ban
        run: |
          node -v
          npm -v
      - name: Cai dependency (npm ci)
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test offline FE (R01 adapter + M02 XSS + S02 cau noi auth + PR4 phien cookie + PR7 nhan vien phu trach + D.0 ngay gio VN; node --test, khong Chrome, khong DB)
        run: |
          set -euo pipefail
          FILES="tests/customerAdapter.test.mjs tests/xssIsolation.test.mjs tests/customerAuthBridge.test.mjs tests/customerApiAuthHeader.test.mjs tests/cookieSession.test.mjs tests/customerApiClientSession.test.mjs tests/rootSelector.test.mjs tests/ownerCandidates.test.mjs tests/changePassword.test.mjs tests/dateVN.test.mjs tests/rememberMe.test.mjs tests/customerContactPerson.test.mjs tests/mobilePwa.test.mjs"
          # node --test coi duong dan khong ton tai nhu glob rong va van thoat 0 -> bat buoc kiem tra ton tai.
          for f in $FILES; do test -f "$f" || { echo "THIEU file test: $f"; exit 1; }; done
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=node-tests-junit.xml $FILES
          node ../../backend/scripts/ci/check-node-test-count.mjs node-tests-junit.xml "${MIN_NODE_TESTS}"
        env:
          MIN_NODE_TESTS: "80"

  secret-scan:
    name: Quet bi mat (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cai gitleaks (ghim phien ban, kiem tra SHA-256)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Quet lich su Git (an gia tri bi mat trong log)
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [backend, backend-pg, frontend, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tat ca kiem tra bat buoc phai dat
        run: |
          echo "backend=${{ needs.backend.result }} backend-pg=${{ needs.backend-pg.result }} frontend=${{ needs.frontend.result }} secret-scan=${{ needs.secret-scan.result }}"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.backend-pg.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.secret-scan.result }}" = "success"
