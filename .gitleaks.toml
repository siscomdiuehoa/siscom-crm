[extend]
useDefault = true

[[allowlists]]
description = "False positive: SISCOM benchmark labels"
targetRules = ["generic-api-key"]
paths = ['''backend/scripts/windows/run-search-bench\.ps1''']
regexTarget = "match"
regexes = ['''BENCH_API_PERF','BENCH_P23A_DIAG''']

# Hai false positive generic-api-key trong lich su cac nhanh auth (khong nam tren main).
# CI quet moi ref (fetch-depth 0 + gitleaks git mac dinh --all), nen cac commit nay bi quet
# du khong thuoc PR dang chay. Moi allowlist ben duoi can DONG THOI (condition = "AND"):
#   - duong dan tuong doi tu goc repo KHOP CHINH XAC (neo ^...$, khong tien to/hau to), VA
#   - TOAN BO dong khop chinh xac dong fixture da xac minh trong lich su (neo ^...$), gom literal
#     GIA (khong phai bi mat that; doc tu 0b498f4 va b36f33e). Doi literal, noi them chuoi cung dong,
#     doi tep/duong dan => van bi quet day du.
#     (\n? dau regex: gitleaks co the gom 1 ky tu xuong dong truoc dong vao "line"; khong nhan them noi dung.)
# Owner duyet 2026-10-23 (CI-GITLEAKS-TWO-FINDINGS-TRIAGE); siet chat theo Q01 (SISCOM-Q01-PR63-EXACT-FIXTURE-HARDENING).
[[allowlists]]
description = "Gia tri gia trong test: SECRET_PW dung de kiem tra khong ro ri log (a5 spec)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^backend/src/common/auth/http/auth-security\.a5\.spec\.ts$''']
regexTarget = "line"
regexes = ['''^\n?  const SECRET_PW = 'Mat-khau-RIENG-khong-duoc-lo-9';$''']

[[allowlists]]
description = "Nhan khoa meta khong phai bi mat: app_meta key auth_bootstrap_done (tai lieu test SQL)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^backend/docs/B1\.3_M1_CONSTRAINT_TESTS\.sql\.txt$''']
regexTarget = "line"
regexes = ['''^\n?INSERT INTO app_meta \(key, value\) VALUES \('auth_bootstrap_done', 'b13-constraint-test'\);$''']
