<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SISCOM AI Live Status</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#0b1020;color:#e8edf7;margin:0;padding:24px}
main{max-width:1100px;margin:auto}.muted{color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:20px 0}
.card{background:#111827;border:1px solid #334155;border-radius:16px;padding:16px}
.value{font-size:1.3rem;font-weight:700;margin-top:8px}.ok{color:#4ade80}.warn{color:#fbbf24}.bad{color:#fb7185}
.event{padding:9px 12px;border-left:3px solid #475569;background:#0f172a;border-radius:8px;margin:8px 0}
</style></head><body><main>
<h1>SISCOM AI Live Status</h1><div class="muted">ChatGPT ↔ GitHub ↔ Claude Auto-Runner · heartbeat 1 giây</div>
<div class="grid">
<div class="card"><div class="muted">Claude</div><div id="claude" class="value">...</div><div id="task" class="muted"></div></div>
<div class="card"><div class="muted">Git</div><div id="branch" class="value">...</div><div id="commit" class="muted"></div></div>
<div class="card"><div class="muted">PR / CI</div><div id="ci" class="value">...</div><div id="pr" class="muted"></div></div>
<div class="card"><div class="muted">Cần anh duyệt</div><div id="approval" class="value">...</div></div>
</div>
<div class="card"><h2>Timeline</h2><div id="heartbeat" class="muted"></div><div id="timeline"></div></div>
</main><script>
let S={};
function esc(v){return String(v??"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function render(s){
 S=s;
 document.getElementById("claude").textContent=s.claude?.state||"unknown";
 document.getElementById("task").textContent=s.claude?.task||"Không có task";
 document.getElementById("branch").textContent=s.git?.branch||"-";
 document.getElementById("commit").textContent=s.git?.commit||"";
 document.getElementById("ci").textContent=s.github?.ci||"-";
 document.getElementById("pr").textContent=s.github?.pr||"Không có PR mở";
 document.getElementById("approval").textContent=s.approval?.needed?(s.approval?.message||"Cần duyệt"):"Không";
 document.getElementById("heartbeat").textContent="Heartbeat: "+new Date(s.heartbeat||Date.now()).toLocaleTimeString();
 document.getElementById("timeline").innerHTML=(s.timeline||[]).slice().reverse().map(function(x){return '<div class="event"><b>'+esc(x.type)+'</b> · '+esc(x.message)+'<div class="muted">'+esc(x.at)+'</div></div>'}).join("");
}
fetch("/api/status").then(function(r){return r.json()}).then(render);
const es=new EventSource("/events"); es.onmessage=function(x){try{render(JSON.parse(x.data))}catch(e){}};
setInterval(function(){document.getElementById("heartbeat").textContent="Heartbeat: "+new Date(S.heartbeat||Date.now()).toLocaleTimeString()},1000);
</script></body></html>
